name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-24.04
    # gitleaks-action lists the PR's commits via the API, which needs
    # pull-requests:read. The repo default token does not grant it, so
    # without this block the action fails with a 403 on every PR.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Blocks on high and critical CVEs; moderate and below are logged only. Unlike a raw
      # `npm audit --audit-level=high`, this gate tolerates advisories whose only fix is younger
      # than the .npmrc min-release-age cooldown, each with an expiry (see scripts/audit-gate.mjs
      # and scripts/audit-allowlist.json). Once a fix ages past the cooldown its entry expires and
      # the gate fails again until the fix is applied.
      - name: npm audit (cooldown-aware gate)
        run: npm run audit:ci

  semgrep:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # auto config pulls rules for every language detected in the repo.
      # --error exits non-zero on any finding.
      - name: Semgrep scan
        run: semgrep scan --config=auto --error .

  trivy:
    name: Vulnerability and config scan (Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Trivy filesystem scan (deps + secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          # Tolerates advisories whose fix is younger than the .npmrc min-release-age cooldown,
          # each with an expiry (see .trivyignore.yaml). Mirrors scripts/audit-allowlist.json.
          trivyignores: .trivyignore.yaml

      - name: Trivy Dockerfile config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

  trivy-image:
    name: Image scan (Trivy) - ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-api
            context: .
            dockerfile: services/core-api/Dockerfile
          - name: media
            context: .
            dockerfile: services/media/Dockerfile
          - name: audit
            context: .
            dockerfile: services/audit/Dockerfile
          - name: ai
            context: services/ai
            dockerfile: services/ai/Dockerfile
          # The two Next apps need the public Entra identifiers baked in at build time, same as the
          # ci.yml build matrix. They are public ids, so plain repo Variables, not Secrets.
          - name: pwa
            context: .
            dockerfile: apps/pwa/Dockerfile
            build_args: |
              NEXT_PUBLIC_AZURE_TENANT_ID=${{ vars.ENTRA_TENANT_ID }}
              NEXT_PUBLIC_AZURE_CLIENT_ID=${{ vars.ENTRA_CLIENT_ID }}
          - name: dashboard
            context: .
            dockerfile: apps/dashboard/Dockerfile
            build_args: |
              NEXT_PUBLIC_AZURE_TENANT_ID=${{ vars.ENTRA_TENANT_ID }}
              NEXT_PUBLIC_AZURE_CLIENT_ID=${{ vars.ENTRA_CLIENT_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build the runtime image into the local docker daemon (no push). Reuses the same gha cache
      # scope ci.yml populates, so this rarely rebuilds from scratch.
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: runtime
          load: true
          push: false
          build-args: ${{ matrix.build_args }}
          tags: mat-inspect/${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}

      # Scans the built image. ignore-unfixed drops CVEs with no upstream fix (nothing to do).
      # The shared .trivyignore.yaml suppresses only cooldown-blocked dependency fixes, each with an
      # expiry, mirroring the fs scan and scripts/audit-allowlist.json (DEV-102). exit-code 1 fails
      # the job on any surviving HIGH or CRITICAL.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: mat-inspect/${{ matrix.name }}:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

  hadolint:
    name: Dockerfile lint (Hadolint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          recursive: true
          failure-threshold: error

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Blocks on high and critical CVEs; moderate and below are logged only.
      - name: npm audit
        run: npm audit --audit-level=high

  semgrep:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      # auto config pulls rules for every language detected in the repo.
      # --error exits non-zero on any finding.
      - name: Semgrep scan
        run: semgrep scan --config=auto --error .

  trivy:
    name: Vulnerability and config scan (Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (deps + secrets)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy Dockerfile config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  hadolint:
    name: Dockerfile lint (Hadolint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          failure-threshold: error

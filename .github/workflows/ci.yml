name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  type-check:
    name: Type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: tsc
        run: npm run type-check

  test-ts:
    name: Test (TypeScript)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vitest
        # --passWithNoTests is temporary until real test files exist. Remove this flag in Sprint 1.
        run: npm test

  test-python:
    name: Test (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai/requirements.txt

      - name: Install dependencies
        run: pip install -r services/ai/requirements.txt pytest

      - name: pytest
        run: pytest services/ai --tb=short

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [lint, type-check, test-ts, test-python]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: tsc build
        run: npm run build

  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: core-api
            context: .
            dockerfile: services/core-api/Dockerfile
          - name: media
            context: .
            dockerfile: services/media/Dockerfile
          - name: audit
            context: .
            dockerfile: services/audit/Dockerfile
          - name: ai
            context: services/ai
            dockerfile: services/ai/Dockerfile
          - name: pwa
            context: apps/pwa
            dockerfile: apps/pwa/Dockerfile
          - name: dashboard
            context: apps/dashboard
            dockerfile: apps/dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/mat-inspect/${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER }}/mat-inspect/${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

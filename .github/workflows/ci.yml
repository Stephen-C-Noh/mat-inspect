name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  type-check:
    name: Type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: tsc
        run: npm run type-check

  test-ts:
    name: Test (TypeScript)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Workspace packages resolve through their built entry (dist/index.js), so the
      # tests that import them (for example @mat-inspect/db) need the build first.
      - name: Build packages
        run: npm run build

      - name: Vitest
        # --passWithNoTests is temporary until real test files exist. Remove this flag in Sprint 1.
        run: npm test

  test-python:
    name: Test (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai/requirements.txt

      - name: Install dependencies
        run: pip install -r services/ai/requirements.txt pytest

      - name: pytest
        run: pytest services/ai --tb=short

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [lint, type-check, test-ts, test-python]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: tsc build
        run: npm run build

  build-and-push:
    # On pull_request this builds the images without pushing, so a workspace
    # import that breaks an image build (for example adding a package import the
    # Dockerfile does not copy) fails the PR instead of only the main push.
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: core-api
            context: .
            dockerfile: services/core-api/Dockerfile
          - name: media
            context: .
            dockerfile: services/media/Dockerfile
          - name: audit
            context: .
            dockerfile: services/audit/Dockerfile
          - name: ai
            context: services/ai
            dockerfile: services/ai/Dockerfile
          # NEXT_PUBLIC_* are inlined into the client bundle at build time (DEV-110). Without
          # these, the published image ships an empty client_id and Entra login fails with
          # AADSTS900144. Tenant id and client id are public identifiers, so plain repo Variables,
          # not Secrets. Only the two Next apps declare these ARGs; the other images have no
          # build_args and so get none.
          - name: pwa
            context: .
            dockerfile: apps/pwa/Dockerfile
            build_args: |
              NEXT_PUBLIC_AZURE_TENANT_ID=${{ vars.ENTRA_TENANT_ID }}
              NEXT_PUBLIC_AZURE_CLIENT_ID=${{ vars.ENTRA_CLIENT_ID }}
          - name: dashboard
            context: .
            dockerfile: apps/dashboard/Dockerfile
            build_args: |
              NEXT_PUBLIC_AZURE_TENANT_ID=${{ vars.ENTRA_TENANT_ID }}
              NEXT_PUBLIC_AZURE_CLIENT_ID=${{ vars.ENTRA_CLIENT_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: ${{ github.event_name == 'push' }}
          # Empty for every image except pwa and dashboard (see the matrix comment).
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ env.OWNER }}/mat-inspect/${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER }}/mat-inspect/${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

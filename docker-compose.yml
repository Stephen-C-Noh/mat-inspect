services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by postgres-init.sh to create the audit_migrator / audit_writer roles (DEV-23,
      # ARCHITECTURE.md 8.4 rule 8). Only used at first volume init.
      AUDIT_MIGRATOR_DB_PASSWORD: ${AUDIT_MIGRATOR_DB_PASSWORD}
      AUDIT_WRITER_DB_PASSWORD: ${AUDIT_WRITER_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      # Loopback-only: host tooling needs access; 0.0.0.0 would expose to LAN (Docker bypasses iptables).
      # Host port is configurable so contributors with 5432 already in use can override it.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mat-internal

  # Nightly pg_dump for dev staging (DEV-43, ARCHITECTURE.md 12.5 and 12.7). Runs no database:
  # it reuses the postgres:16-alpine image only so pg_dump matches the server major version (a
  # dump is not restorable into a server older than the pg_dump that wrote it) and no extra
  # image is pulled. The scheduler runs one verified backup a day and rotates old dumps.
  #
  # Prod does not run this service: there the database is Azure Database for PostgreSQL with
  # managed automated backups (ADR 0005). Verify those with infra/backup/verify-azure-backups.sh.
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # libpq reads these; no credential is ever passed on a command line or logged.
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      # Schedule and retention. Overridable from .env; defaults match ADR 0005's 7-day prod
      # window so dev staging and prod age dumps out on the same clock.
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    entrypoint: ['/bin/sh', '/opt/backup/backup-scheduler.sh']
    volumes:
      - ./infra/backup/pg-backup.sh:/opt/backup/pg-backup.sh:ro
      - ./infra/backup/backup-scheduler.sh:/opt/backup/backup-scheduler.sh:ro
      # Separate named volume, not postgres_data: a backup on the same volume as the data it
      # protects dies with it (DEV-43, "written to a separate volume"). The host owner's rsync
      # job copies this volume off-host (ARCHITECTURE.md 12.5, 12.7).
      - db_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The scheduler touches the heartbeat every 30s. If it is older than 2 min the loop is
      # wedged. This proves the scheduler is alive, not that a dump is fresh: a nightly job is
      # idle most of the day, so dump freshness is the wrong liveness signal.
      test: ['CMD-SHELL', 'find /tmp/db-backup-heartbeat -mmin -2 2>/dev/null | grep -q .']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - mat-internal

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    # --skipApiVersionCheck: the @azure/storage-blob SDK (Media Service) sends a newer REST API
    # version than this Azurite build whitelists. The operations used are all supported; real
    # Azure Blob accepts the version. Without the flag every upload fails with an API-version error.
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --skipApiVersionCheck
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 10000 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mat-internal

  caddy:
    image: caddy:2.8-alpine
    ports:
      - '80:80'
      - '443:443'
      # Dev listener (ADR 0020). Loopback only: it is plain HTTP and exists so the Next dev servers
      # can proxy /api/v1 through the same routing table staging uses. Not reachable from the LAN.
      - '127.0.0.1:8080:8080'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # The browser reaches the apps through here, so they are upstreams like any service. ai is not:
    # it has no route (ADR 0019, ADR 0020).
    depends_on:
      - core-api
      - media
      - audit
      - pwa
      - dashboard
    # Probe the site over TLS, not the admin API. The old check hit the admin socket on 127.0.0.1:2019,
    # which answers even when Caddy is serving nothing, so a gateway with a broken listener reported
    # healthy (seen on the box in DEV-95). This request goes through the real site block, so it fails
    # if the site is not served or the internal CA never issued its certificate.
    #
    # It cannot tell whether the port is published on the HOST: a Docker healthcheck runs inside the
    # container, and a probe aimed back at the host returns through Docker's DNAT rules even when the
    # host-side bind failed (reproduced on a dev box where another process held 443). That property
    # is checked from outside, on the box, by scripts/smoke-gateway.sh after every deploy.
    #
    # extra_hosts resolves the site name to the container itself so the request matches the site
    # block. --no-check-certificate: the certificate is from Caddy's own internal CA, and this is a
    # liveness probe, not a trust check.
    extra_hosts:
      - 'mat-inspect.staging:127.0.0.1'
      - 'dashboard.mat-inspect.staging:127.0.0.1'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '--no-check-certificate',
          '-O-',
          'https://mat-inspect.staging/gateway/health',
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - mat-internal

  core-api:
    image: ghcr.io/${REGISTRY_OWNER}/mat-inspect/core-api:${TAG:-latest}
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
      target: runtime
    environment:
      PORT: '3000'
      OTEL_SERVICE_NAME: core-api
      DATABASE_URL: ${CORE_API_DB_URL}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
      # Outbox poller delivery target (DEV-23 / ADR 0008).
      AUDIT_SERVICE_URL: 'http://audit:3000'
      AUDIT_INGEST_TOKEN: ${AUDIT_INGEST_TOKEN}
      # Transcription proxy target (ADR 0019). Internal address only: the AI Service is not
      # published to the browser, and core-api is the only client that authenticates in front of it.
      AI_SERVICE_URL: 'http://ai:8000'
      # Failure notifications (DEV-39 Teams, DEV-21 email; ADR 0013). All optional: core-api reads
      # them in config.ts and falls back to the dashboard failure queue (the guaranteed channel)
      # when unset. Without these mappings the values in .env never reach the container, so the
      # Teams card and the supervisor email never fire.
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SUPERVISOR_ALERT_EMAILS: ${SUPERVISOR_ALERT_EMAILS}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - mat-internal

  media:
    image: ghcr.io/${REGISTRY_OWNER}/mat-inspect/media:${TAG:-latest}
    build:
      context: .
      dockerfile: services/media/Dockerfile
      target: runtime
    environment:
      PORT: '3000'
      OTEL_SERVICE_NAME: media
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
      # Used by verifyToken to validate the operator's Entra access token (ADR 0002, ADR 0012).
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
    depends_on:
      azurite:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - mat-internal

  # Daily raw voice-audio retention purge for dev staging (DEV-41, ARCHITECTURE.md 8.4). Reuses the
  # already-built media image (no build block of its own) and overrides the entrypoint to the
  # scheduler, which invokes the compiled purge job in that image. The job deletes only raw clips
  # past the 90-day window from the voice Blob Storage container; it never touches the transcript,
  # the inspection record, or any database row (it opens no database connection).
  #
  # Prod does not run this service: there the 90-day purge is a container lifecycle-management
  # policy on the Azure Storage account (ADR 0004), the same way the 7-day pg backup window is
  # managed by Azure in prod (see db-backup).
  voice-retention:
    image: ghcr.io/${REGISTRY_OWNER}/mat-inspect/media:${TAG:-latest}
    restart: unless-stopped
    environment:
      # Storage is the only dependency the job uses. Entra and Application Insights are required by
      # the shared media config loader (ADR 0015) but unused by the job; passed through so the boot
      # validation passes with the same values the media service already uses.
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
      # Schedule and window. Defaults match ARCHITECTURE.md 8.4 (90 days) and run in the small hours
      # after the 02:00 db backup so the two jobs do not overlap. Overridable from .env.
      RETENTION_TIME: ${VOICE_RETENTION_TIME:-03:30}
      MEDIA_VOICE_RETENTION_DAYS: ${MEDIA_VOICE_RETENTION_DAYS:-90}
      # Set true to preview a run (log what would be purged) without deleting. Use on first deploy.
      RETENTION_DRY_RUN: ${VOICE_RETENTION_DRY_RUN:-false}
    entrypoint: ['/bin/sh', '/opt/retention/voice-retention-scheduler.sh']
    volumes:
      - ./infra/retention/voice-retention-scheduler.sh:/opt/retention/voice-retention-scheduler.sh:ro
    depends_on:
      azurite:
        condition: service_healthy
    healthcheck:
      # The scheduler touches the heartbeat every 30s. If it is older than 2 min the loop is wedged.
      # This proves the scheduler is alive, not that a purge is fresh: a daily job is idle most of
      # the day, so purge freshness is the wrong liveness signal (same rule as db-backup).
      test: ['CMD-SHELL', 'find /tmp/voice-retention-heartbeat -mmin -2 2>/dev/null | grep -q .']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - mat-internal

  audit:
    image: ghcr.io/${REGISTRY_OWNER}/mat-inspect/audit:${TAG:-latest}
    build:
      context: .
      dockerfile: services/audit/Dockerfile
      target: runtime
    environment:
      PORT: '3000'
      OTEL_SERVICE_NAME: audit
      # Runtime connection: audit_writer (INSERT + SELECT only on audit_events; DEV-23). Migrations
      # run separately via AUDIT_MIGRATOR_DB_URL (see services/audit/db/migrate.ts), never this one.
      DATABASE_URL: ${AUDIT_API_DB_URL}
      AUDIT_INGEST_TOKEN: ${AUDIT_INGEST_TOKEN}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
      # Nightly full-chain verification (DEV-40). CHAIN_VERIFY_TIME is HH:MM in LAB_TIMEZONE, not
      # the container's ambient TZ (UTC on the alpine image); the service resolves the zone via
      # ICU, so no tzdata package is needed. Default 02:30 stays clear of db-backup's 02:00.
      CHAIN_VERIFY_TIME: ${CHAIN_VERIFY_TIME:-02:30}
      LAB_TIMEZONE: ${LAB_TIMEZONE:-America/Edmonton}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - mat-internal

  ai:
    image: ghcr.io/${REGISTRY_OWNER}/mat-inspect/ai:${TAG:-latest}
    build:
      context: ./services/ai
      target: runtime
    environment:
      PORT: '8000'
      OTEL_SERVICE_NAME: ai
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
      # ADR 0017: the transcription concurrency cap and the container's CPU ceiling are the same
      # number, so a saturated cap cannot ask for more CPU time than the container may use.
      # AI_CPUS is the single source for both. Sized to 2 by the mini-PC benchmark.
      AI_MAX_CONCURRENCY: ${AI_CPUS:-2}
      # Weights live on the host and are bind-mounted read-only below (DEV-95). Both paths point
      # into that mount, so neither model reaches the network at load time. If the mount is empty
      # the service still boots: /advisory answers UNAVAILABLE and /transcribe answers 503.
      ADVISORY_MODEL_PATH: /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
      # A local CTranslate2 directory, not the bare name "small.en". The bare name makes
      # faster-whisper resolve the model through the Hugging Face cache and download it on a miss,
      # which would put a network fetch on the service's boot path.
      AI_TRANSCRIPTION_MODEL: /models/faster-whisper-small.en
      # Belt and braces on the line above: if a path is ever wrong, fail the model load instead of
      # silently downloading 461 MB from Hugging Face on boot.
      HF_HUB_OFFLINE: '1'
    # ADR 0017. `cpus` is a ceiling (CFS quota), not a reservation: it stops the ai container
    # starving the other services, but it does not stop them starving it. Docker has no true CPU
    # reservation (Compose ignores deploy.resources.reservations.cpus outside Swarm), so the
    # defence against contention is weight: cpu_shares puts the ai container ahead of the default
    # 1024 when the box is oversubscribed. Under sustained contention the container can still get
    # less than AI_CPUS worth of CPU and transcription latency degrades; pin with `cpuset` if the
    # mini-PC ever needs a hard partition.
    cpus: ${AI_CPUS:-2}
    cpu_shares: 2048
    mem_limit: 4g
    volumes:
      # Read-only: the service loads weights, it never writes them. Provisioned once per box by
      # scripts/fetch-ai-models.sh, so redeploys do not re-download 1.5 GB. Not a named volume: an
      # operator has to be able to see, verify and replace these files without entering a
      # container. See docs/runbooks/ai-model-weights.md.
      - ${AI_MODELS_DIR:-./models}:/models:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'')"',
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - mat-internal

  pwa:
    image: ghcr.io/${REGISTRY_OWNER}/mat-inspect/pwa:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/pwa/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_AZURE_TENANT_ID: ${ENTRA_TENANT_ID}
        NEXT_PUBLIC_AZURE_CLIENT_ID: ${ENTRA_CLIENT_ID}
        # Baked into routes-manifest.json by next.config rewrites(), so it is a build arg, not a
        # runtime variable. In Compose the browser reaches Caddy directly and this rewrite carries
        # no traffic; it points at the gateway anyway, never at a service (ADR 0020).
        GATEWAY_URL: 'http://caddy:8080'
    environment:
      PORT: '3000'
      APP_NAME: pwa
    # No published port. The browser reaches the PWA through Caddy over TLS, because MSAL needs a
    # secure context and http://<box>:3000 is not one (ADR 0020).
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - mat-internal

  dashboard:
    image: ghcr.io/${REGISTRY_OWNER}/mat-inspect/dashboard:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_AZURE_TENANT_ID: ${ENTRA_TENANT_ID}
        NEXT_PUBLIC_AZURE_CLIENT_ID: ${ENTRA_CLIENT_ID}
        GATEWAY_URL: 'http://caddy:8080'
    environment:
      PORT: '3000'
    # No published port, same reason as the PWA: the dashboard is served over TLS at
    # dashboard.mat-inspect.staging (ADR 0020).
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - mat-internal

volumes:
  postgres_data:
  # Nightly pg_dump target (DEV-43). Deliberately separate from postgres_data so a lost data
  # volume does not take the backups with it.
  db_backups:
  azurite_data:
  caddy_data:
  caddy_config:

networks:
  mat-internal:
    driver: bridge

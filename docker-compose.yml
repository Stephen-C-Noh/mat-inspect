services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Loopback-only: host tooling needs access; 0.0.0.0 would expose to LAN (Docker bypasses iptables).
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mat-internal

  minio:
    image: minio/minio:RELEASE.2024-06-26T01-06-18Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mat-internal

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing myminio/mat-inspect-media &&
      mc mb --ignore-existing myminio/mat-inspect-reports &&
      echo 'MinIO buckets ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - mat-internal

  caddy:
    image: caddy:2.8-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - core-api
      - media
      - audit
      - ai
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mat-internal

  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
      target: runtime
    environment:
      PORT: '3000'
      SERVICE_NAME: core-api
      DATABASE_URL: ${CORE_API_DB_URL}
      HMAC_SECRET: ${HMAC_SECRET}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mat-internal

  media:
    build:
      context: .
      dockerfile: services/media/Dockerfile
      target: runtime
    environment:
      PORT: '3000'
      SERVICE_NAME: media
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mat-internal

  audit:
    build:
      context: .
      dockerfile: services/audit/Dockerfile
      target: runtime
    environment:
      PORT: '3000'
      SERVICE_NAME: audit
      DATABASE_URL: ${AUDIT_API_DB_URL}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mat-internal

  ai:
    build:
      context: ./services/ai
      target: runtime
    environment:
      PORT: '8000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'')"',
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - mat-internal

  pwa:
    build:
      context: ./apps/pwa
      target: runtime
    environment:
      PORT: '3000'
      APP_NAME: pwa
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mat-internal

  dashboard:
    build:
      context: ./apps/dashboard
      target: runtime
    environment:
      PORT: '3000'
      APP_NAME: dashboard
    ports:
      - '3001:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mat-internal

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  mat-internal:
    driver: bridge

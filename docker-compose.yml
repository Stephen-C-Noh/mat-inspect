services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Loopback-only: host tooling needs access; 0.0.0.0 would expose to LAN (Docker bypasses iptables).
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mat-internal

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 10000 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mat-internal

  caddy:
    image: caddy:2.8-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - core-api
      - media
      - audit
      - ai
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mat-internal

  core-api:
    image: ghcr.io/${REGISTRY_OWNER}/mat-inspect/core-api:${TAG:-latest}
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
      target: runtime
    environment:
      PORT: '3000'
      OTEL_SERVICE_NAME: core-api
      DATABASE_URL: ${CORE_API_DB_URL}
      HMAC_SECRET: ${HMAC_SECRET}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - mat-internal

  media:
    image: ghcr.io/${REGISTRY_OWNER}/mat-inspect/media:${TAG:-latest}
    build:
      context: .
      dockerfile: services/media/Dockerfile
      target: runtime
    environment:
      PORT: '3000'
      OTEL_SERVICE_NAME: media
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
    depends_on:
      azurite:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - mat-internal

  audit:
    image: ghcr.io/${REGISTRY_OWNER}/mat-inspect/audit:${TAG:-latest}
    build:
      context: .
      dockerfile: services/audit/Dockerfile
      target: runtime
    environment:
      PORT: '3000'
      OTEL_SERVICE_NAME: audit
      DATABASE_URL: ${AUDIT_API_DB_URL}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - mat-internal

  ai:
    image: ghcr.io/${REGISTRY_OWNER}/mat-inspect/ai:${TAG:-latest}
    build:
      context: ./services/ai
      target: runtime
    environment:
      PORT: '8000'
      OTEL_SERVICE_NAME: ai
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'')"',
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - mat-internal

  pwa:
    image: ghcr.io/${REGISTRY_OWNER}/mat-inspect/pwa:${TAG:-latest}
    build:
      context: ./apps/pwa
      target: runtime
    environment:
      PORT: '3000'
      APP_NAME: pwa
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - mat-internal

  dashboard:
    image: ghcr.io/${REGISTRY_OWNER}/mat-inspect/dashboard:${TAG:-latest}
    build:
      context: ./apps/dashboard
      target: runtime
    environment:
      PORT: '3000'
      APP_NAME: dashboard
    ports:
      - '3001:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - mat-internal

volumes:
  postgres_data:
  azurite_data:
  caddy_data:
  caddy_config:

networks:
  mat-internal:
    driver: bridge

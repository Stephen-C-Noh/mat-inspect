# Trivy counterpart of scripts/audit-allowlist.json. Same reasoning: the repo pins
# min-release-age=7 in .npmrc, so an advisory whose only fix is younger than 7 days cannot
# be installed yet and blocks CI with no way to fix it. Each entry carries expired_at; once
# the fix ages past the cooldown Trivy re-surfaces the finding until the fix is applied.
# Keep these in sync with scripts/audit-allowlist.json, but not by copying the dates. The two
# gates read their boundary differently: audit-gate.mjs compares with `today > expires`, so the
# expiry day is still tolerated, while Trivy drops an entry from 00:00Z of expired_at. A date that
# is identical in both files therefore fails Trivy one day earlier. To make both gates turn red on
# the same day, expired_at here must be one day past the matching `expires` in audit-allowlist.json.
#
# Set expired_at from the cooldown release timestamp, not from the publish date plus seven days.
# min-release-age is evaluated against the publish time, so a fix published late in the day on
# 2026-07-21 is not installable until late on 2026-07-28. Rounding that down to a whole day is what
# left CI red and unfixable for ~17 hours on 2026-07-28 (see DEV-132).
#
# The DEV-102 batch (2026-07-29) applied real overrides for every advisory previously listed here
# except the brace-expansion 5.x line, which does not appear in Trivy's image scans at all: that
# path (@typescript-eslint/typescript-estree's minimatch@10.2.5) is a devDependency, not present in
# any built image, so it is tracked only in scripts/audit-allowlist.json (the npm audit gate, which
# scans the whole install tree including devDependencies).
#
# Tracked in DEV-102.

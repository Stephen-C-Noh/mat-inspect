    expired_at: 2026-07-29
    statement: '@opentelemetry/propagator-jaeger 2.9.0 fix published 2026-07-21; blocked by min-release-age until ~2026-07-28. Transitive via @azure/monitor-opentelemetry; JaegerPropagator is not used (W3C TraceContext).'

# Trivy counterpart of scripts/audit-allowlist.json. Same reasoning: the repo pins
# min-release-age=7 in .npmrc, so an advisory whose only fix is younger than 7 days cannot
# be installed yet and blocks CI with no way to fix it. Each entry carries expired_at; once
# the fix ages past the cooldown Trivy re-surfaces the finding until the fix is applied.
# Keep these in sync with scripts/audit-allowlist.json. Tracked in DEV-102.
vulnerabilities:
  - id: CVE-2026-59892
    expired_at: 2026-07-29
    statement: '@opentelemetry/propagator-jaeger 2.9.0 fix published 2026-07-21; blocked by min-release-age until ~2026-07-28. Transitive via @azure/monitor-opentelemetry; JaegerPropagator is not used (W3C TraceContext).'
  - id: CVE-2026-13676
    expired_at: 2026-07-29
    statement: 'fast-uri fix (3.1.3/3.1.4) published 2026-07-19; the min-release-age cooldown has now passed. Held to the DEV-102 batch date rather than pulled forward: npm 11 re-evaluates overrides only on a clean lockfile regen, and next/find-my-way/propagator-jaeger do not clear the cooldown until ~2026-07-28, so a fix today would be a partial batch needing a second regen. Extended from 2026-07-27 in DEV-130. Transitive via fastify/ajv.'
  - id: CVE-2026-16221
    expired_at: 2026-07-29
    statement: 'fast-uri 3.1.4 fix published 2026-07-19; same as CVE-2026-13676. Held to the DEV-102 batch date. Extended from 2026-07-27 in DEV-130. Transitive via fastify/ajv.'
